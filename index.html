<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hashli – Klassensprecherin</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #312e81);
      color: white;
      text-align: center;
    }

    .box {
      max-width: 700px;
      margin: 60px auto;
      padding: 35px 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 25px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 25px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 25px;
      background: white;
      color: #312e81;
      border-radius: 15px;
      text-decoration: none;
      font-weight: bold;
    }

    .button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>✨ Hashli for Klassensprecherin ✨</h1>

    <h2>Warum solltest du mich wählen?</h2>

    <p>
      Ich will unsere Klasse nicht langweilig machen 😭
      <br>
      Ich höre euch zu, nehme eure Ideen ernst und versuche,
      dass wir als Klasse mehr zusammen machen.
    </p>

    <p>
      💬 Eure Meinung zählt<br>
      🤝 Gemeinsam statt allein<br>
      🎉 Mehr coole Aktionen
    </p>

    <a class="button" href="#">
      🗳️ Wählt Hashli!
    </a>
  </div>

</body>
</html>
